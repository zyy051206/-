<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="张远洋的精彩操作：无畏契约游戏片段回放。">
  <meta name="theme-color" content="#348cb2">
  <title>精彩操作 · 张远洋</title>
  <style>
    :root{color-scheme:light;font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;color:#fff;background:#348cb2;-webkit-font-smoothing:antialiased}
    *{box-sizing:border-box}
    body{margin:0;min-width:320px;min-height:100vh}
    a{color:inherit;text-decoration:none}
    svg{display:block;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    a:focus-visible,.play-ring:focus-visible{outline:2px solid currentColor;outline-offset:6px}
    .landscape{position:fixed;inset:0;overflow:hidden;background:#348cb2;z-index:-1;pointer-events:none}
    .mountains{position:absolute;inset:0 auto 0 0;width:calc(100% + 1500px);background:#348cb2 url("../../assets/nange/bg.jpg") repeat-x left bottom;background-size:1500px 500px;animation:mountain-drift 60s linear infinite;will-change:transform}
    .landscape-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,54,80,.07) 0%,rgba(16,63,84,.04) 48%,rgba(7,27,43,.32) 100%),url("../../assets/nange/overlay.svg") center/cover no-repeat}
    .landscape-texture{position:absolute;inset:0;background:url("../../assets/nange/overlay-pattern.png") repeat;opacity:.35}
    .shell{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;padding:0 24px}
    .topbar{width:min(1080px,100%);margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:18px;padding-top:30px}
    .back{display:inline-flex;align-items:center;gap:9px;font-size:11px;letter-spacing:.12em;color:rgba(255,255,255,.82);transition:color .2s}
    .back svg{width:17px;height:17px}
    .back:hover{color:#fff}
    .topmark{margin:0;font-size:10px;letter-spacing:.24em;color:rgba(255,255,255,.62)}
    .topmark strong{font-weight:500;color:#fff}
    .topmark span{margin:0 8px;opacity:.5}
    .main{width:100%;flex:1;display:flex;flex-direction:column;justify-content:center;padding:34px 0 30px;animation:arrive .8s ease-out both}
    .identity{text-align:center}
    .eyebrow{font-size:10px;font-weight:500;letter-spacing:.3em;margin:0 0 18px;color:rgba(255,255,255,.72)}
    h1{font-size:clamp(44px,5.5vw,60px);line-height:1.15;letter-spacing:.08em;text-indent:.08em;font-weight:700;margin:0 0 16px;text-shadow:0 2px 15px rgba(14,56,78,.08)}
    .signature{font-size:15px;line-height:1.8;letter-spacing:.12em;margin:0;color:rgba(255,255,255,.9)}
    .signature span{margin:0 8px;opacity:.7}
    .clips{display:flex;justify-content:center;align-items:center;gap:22px;width:min(1000px,100%);margin:30px auto 0}
    .clip-card{position:relative;margin:0;min-width:0}
    .clip-card.wide{flex:0 1 620px}
    .clip-card.tall{flex:0 1 268px}
    .frame{position:relative;overflow:hidden;border-radius:14px;border:1px solid rgba(255,255,255,.55);background:linear-gradient(155deg,rgba(10,38,57,.94),rgba(6,23,36,.97));box-shadow:0 22px 60px rgba(8,32,50,.28)}
    .wide .frame{aspect-ratio:16/9}
    .tall .frame{aspect-ratio:9/16}
    .frame video{display:block;width:100%;height:100%;object-fit:contain;background:#071a26}
    .clip-card[data-state="loading"] .frame video{visibility:hidden}
    .overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;transition:opacity .25s ease}
    .play-ring{display:grid;place-items:center;width:78px;height:78px;border:1px solid rgba(255,255,255,.82);border-radius:50%;background:rgba(9,31,47,.22);backdrop-filter:blur(2px);transition:transform .2s ease,background .2s ease;pointer-events:auto;cursor:pointer}
    .tall .play-ring{width:64px;height:64px}
    .play-ring svg{width:27px;height:27px}
    .tall .play-ring svg{width:23px;height:23px}
    .play-ring:hover{transform:translateY(-3px);background:rgba(255,255,255,.2)}
    .play-ring:active{transform:translateY(0) scale(.94)}
    .clip-card.is-playing .overlay{opacity:0;pointer-events:none}
    .clip-card[data-state="empty"] .play-ring{opacity:.35;pointer-events:none;cursor:default}
    .clip-card figcaption{display:flex;align-items:baseline;gap:9px;padding:12px 2px 0;font-size:11px;letter-spacing:.1em;color:rgba(255,255,255,.9);text-shadow:0 1px 6px rgba(8,30,45,.5)}
    .clip-index{font-variant-numeric:tabular-nums;color:rgba(255,255,255,.55)}
    .clip-name{font-weight:600}
    .clip-tag{font-size:9px;line-height:1.5;padding:2px 6px;border:1px solid rgba(255,255,255,.32);border-radius:3px;color:rgba(255,255,255,.72);letter-spacing:.06em}
    .clip-status{margin-left:auto;font-size:9px;letter-spacing:.08em;color:rgba(255,255,255,.6);white-space:nowrap}
    .footer{text-align:center;padding:22px 0 24px;font-size:10px;line-height:1.8;letter-spacing:.04em;color:rgba(255,255,255,.82);text-shadow:0 1px 7px #183846}
    .footer p{margin:0}
    .footer a{border-bottom:1px dotted rgba(255,255,255,.48);padding-bottom:2px}
    .footer a:hover{color:#fff;border-bottom-color:#fff}
    .footer span{margin:0 9px;opacity:.65}
    @keyframes mountain-drift{to{transform:translateX(-1500px)}}
    @keyframes arrive{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @media(min-width:1800px){.mountains{background-size:1800px 600px;width:calc(100% + 1800px);animation-name:mountain-drift-wide}@keyframes mountain-drift-wide{to{transform:translateX(-1800px)}}}
    @media(max-width:720px){.shell{padding:0 20px}.topbar{padding-top:22px}.topmark{font-size:9px;letter-spacing:.16em}.main{padding:30px 0 34px}h1{font-size:52px;margin-bottom:14px}.signature{font-size:13px;letter-spacing:.06em}.signature span{margin:0 5px}.clips{flex-direction:column;gap:26px;margin-top:26px}.clip-card.wide,.clip-card.tall{flex:0 0 auto;width:100%}.clip-card.tall{width:min(250px,74%)}.frame{border-radius:12px}.footer{padding:18px 0;font-size:9px}.mountains{background-size:1200px 400px;width:calc(100% + 1200px);animation-name:mountain-drift-mobile}@keyframes mountain-drift-mobile{to{transform:translateX(-1200px)}}}
    @media(max-width:400px){.shell{padding:0 16px}.main{padding:26px 0 30px}h1{font-size:44px}.clips{margin-top:22px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="landscape" aria-hidden="true"><div class="mountains"></div><div class="landscape-shade"></div><div class="landscape-texture"></div></div>
  <div class="shell">
    <header class="topbar">
      <a class="back" href="../../index.html"><svg aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg>返回首页</a>
      <p class="topmark"><strong>HIGHLIGHTS</strong><span>/</span>精彩操作</p>
    </header>
    <main class="main">
      <header class="identity">
        <p class="eyebrow">MOMENTS WORTH REPLAYING</p>
        <h1>精彩操作</h1>
        <p class="signature"><span aria-hidden="true">·</span> 值得重看的那几下 <span aria-hidden="true">·</span></p>
      </header>
      <section class="clips" aria-label="精彩操作片段">
        <figure class="clip-card wide" data-state="loading">
          <div class="frame">
            <video controls playsinline preload="metadata" poster="media/clip-01.jpg" aria-label="精彩操作片段 01，横屏">
              <source src="media/clip-01.mp4" type="video/mp4">
            </video>
            <div class="overlay">
              <span class="play-ring" role="button" tabindex="0" aria-label="播放片段 01">
                <svg aria-hidden="true"><path d="M7.8 6.9a.8.8 0 0 1 1.22-.68l8.3 5.1a.8.8 0 0 1 0 1.36l-8.3 5.1a.8.8 0 0 1-1.22-.68Z"/></svg>
              </span>
            </div>
          </div>
          <figcaption><span class="clip-index">01</span><span class="clip-name">精彩片段</span><span class="clip-tag">横屏</span><span class="clip-status" role="status">载入中</span></figcaption>
        </figure>
        <figure class="clip-card tall" data-state="loading">
          <div class="frame">
            <video controls playsinline preload="metadata" poster="media/clip-02.jpg" aria-label="精彩操作片段 02，竖屏">
              <source src="media/clip-02.mp4" type="video/mp4">
            </video>
            <div class="overlay">
              <span class="play-ring" role="button" tabindex="0" aria-label="播放片段 02">
                <svg aria-hidden="true"><path d="M7.8 6.9a.8.8 0 0 1 1.22-.68l8.3 5.1a.8.8 0 0 1 0 1.36l-8.3 5.1a.8.8 0 0 1-1.22-.68Z"/></svg>
              </span>
            </div>
          </div>
          <figcaption><span class="clip-index">02</span><span class="clip-name">精彩片段</span><span class="clip-tag">竖屏</span><span class="clip-status" role="status">载入中</span></figcaption>
        </figure>
      </section>
    </main>
    <footer class="footer"><p>© 2026 张远洋 <span aria-hidden="true">·</span> <a href="../../credits.html">Nange / Aerial · 设计与致谢</a></p></footer>
  </div>
  <script>
    (() => {
      const formatTime = seconds => {
        if (!Number.isFinite(seconds) || seconds <= 0) return '00:00';
        const total = Math.round(seconds);
        return `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`;
      };

      document.querySelectorAll('.clip-card').forEach(card => {
        const video = card.querySelector('video');
        const ring = card.querySelector('.play-ring');
        const status = card.querySelector('.clip-status');

        const play = () => {
          if (card.dataset.state !== 'ready') return;
          video.play().catch(() => {});
        };

        video.addEventListener('loadedmetadata', () => {
          card.dataset.state = 'ready';
          status.textContent = formatTime(video.duration);
        });
        video.addEventListener('error', () => {
          card.dataset.state = 'empty';
          status.textContent = '暂不可用';
        }, true);
        ring.addEventListener('click', play);
        ring.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            play();
          }
        });
        video.addEventListener('play', () => card.classList.add('is-playing'));
        video.addEventListener('pause', () => card.classList.remove('is-playing'));
        video.addEventListener('ended', () => card.classList.remove('is-playing'));
      });
    })();
  </script>
</body>
</html>
