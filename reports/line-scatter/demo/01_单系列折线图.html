<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>01_单系列折线图</title>
  <script src="vendor/echarts.min.js"></script>
</head>
<body style="margin:0;background:white">
  <!-- 容器必须具有明确的宽度和高度 -->
  <div id="chart" style="width:100%;height:500px"></div>
  <script>
const myChart = echarts.init(document.getElementById('chart'));
const option = {
  animation: false, // 关闭动画，便于稳定截图
  title: { text: '2024年月平均气温', left: 'center' },
  textStyle: { fontFamily: 'Microsoft YaHei', fontSize: 18 },
  tooltip: { trigger: 'axis', valueFormatter: v => v + ' ℃' },
  grid: { left: 80, right: 45, top: 80, bottom: 65 },
  xAxis: { type: 'category', // 月份使用类目轴
    data: ['1月','2月','3月','4月','5月','6月',
           '7月','8月','9月','10月','11月','12月'] },
  yAxis: { type: 'value', name: '气温(℃)', min: 0, max: 35 },
  series: [{
    name: '月平均气温', type: 'line', // 单系列折线图
    data: [2,5,10,17,22,26,30,29,25,18,10,4],
    smooth: true, // 平滑折线，仅影响视觉连接方式
    symbolSize: 8,
    lineStyle: { color: 'green', width: 3 }, // 绿色，3px
    itemStyle: { color: 'green' },
    label: { show: true, position: 'top',
             formatter: '{c}', fontSize: 18 } // 显示原始值
  }]
};
myChart.setOption(option); // 应用配置并绘图
window.addEventListener('resize', () => myChart.resize());
  </script>
</body>
</html>
