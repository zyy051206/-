<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#348cb2">
<title>页面未找到 · 张远洋</title>
<style>
  :root{color-scheme:light}
  body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;text-align:center;
       background:#348cb2;color:#fff;
       font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
       -webkit-font-smoothing:antialiased}
  .code{margin:0 0 18px;font-size:12px;letter-spacing:.3em;color:rgba(255,255,255,.75)}
  h1{margin:0 0 16px;font-size:clamp(28px,6vw,44px);line-height:1.3;font-weight:600}
  p{margin:0 0 32px;font-size:15px;line-height:1.85;color:rgba(255,255,255,.88);max-width:34ch}
  a{display:inline-block;padding:12px 24px;border:1px solid rgba(255,255,255,.65);border-radius:5px;
    font-size:14px;color:#fff;text-decoration:none;transition:background .18s}
  a:hover{background:rgba(255,255,255,.14)}
  a:focus-visible{outline:2px solid #fff;outline-offset:6px}
  @media (prefers-reduced-motion:reduce){a{transition:none}}
</style>
</head>
<body>
  <div>
    <p class="code">404 / NOT FOUND</p>
    <h1>这个页面不存在</h1>
    <p>链接可能已经失效，或者地址打错了。回到首页看看其他内容。</p>
