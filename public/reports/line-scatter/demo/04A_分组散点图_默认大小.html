<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>04A_分组散点图_默认大小</title>
  <script src="vendor/echarts.min.js"></script>
</head>
<body style="margin:0;background:white">
  <!-- 容器必须具有明确的宽度和高度 -->
  <div id="chart" style="width:100%;height:390px"></div>
  <script>
const myChart = echarts.init(document.getElementById('chart'));
const option = {
  animation: false,
  title: { text: '广告投入与销售额', left: 'center' },
  textStyle: { fontFamily: 'Microsoft YaHei', fontSize: 18 },
  color: ['green', 'blue'], // 线上绿色，线下蓝色
  legend: { data: ['线上','线下'], top: 35 },
  grid: { left: 90, right: 50, top: 90, bottom: 65 },
  tooltip: { trigger: 'item', formatter: p =>
    p.seriesName + '<br>广告投入：' + p.value[0] +
    ' 万元<br>销售额：' + p.value[1] + ' 万元' },
  xAxis: { type: 'value', name: '广告投入 (万元)',
           nameLocation: 'middle', nameGap: 36, min: 5, max: 35 },
  yAxis: { type: 'value', name: '销售额 (万元)',
           min: 75, max: 275 },
  series: [
    { name: '线上', type: 'scatter',
      data: [[10,100],[12,115],[15,130],[18,150],[20,165]] }, // 未设置symbolSize，采用默认大小
    { name: '线下', type: 'scatter',
      data: [[22,180],[25,200],[28,215],[30,230],[32,250]] } // 未设置symbolSize，采用默认大小
  ]
};
myChart.setOption(option); // 应用配置并绘图
window.addEventListener('resize', () => myChart.resize());
  </script>

</body>
</html>
