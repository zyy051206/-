<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>实验四 饼图的空间</title>
  <style>
    body { margin: 0; background: white; font-family: "Microsoft YaHei", sans-serif; }
    #chart { width: 100vw; height: 100vh; min-height: 500px; }
  </style>
</head>
<body>
<div id="chart"></div>
<script src="../assets/echarts.min.js"></script>
<script>
var myChart = echarts.init(document.getElementById('chart'));
var option = {
    title: [
        {
            text: '某公司2025年两条产品线季度销售额构成',
            subtext: '单位：万元',
            left: 'center',
            top: 30
        },
        {
            text: '电脑',
            left: '25%',
            top: '18%',
            textAlign: 'center',
            textStyle: { fontSize: 16 }
        },
        {
            text: '配件',
            left: '75%',
            top: '18%',
            textAlign: 'center',
            textStyle: { fontSize: 16 }
        }
    ],
    tooltip: {
        trigger: 'item',
        formatter: '{a}<br/>{b}：{c} 万元（{d}%）'
    },
    legend: {
        bottom: 30,
        data: ['Q1', 'Q2', 'Q3', 'Q4']
    },
    series: [
        {
            name: '电脑销售额',
            type: 'pie',
            left: '0%',
            top: 0,
            width: '50%',
            height: '100%',
            radius: '60%',
            center: ['50%', '50%'],
            label: {
                show: true,
                position: 'outside',
                alignTo: 'labelLine',
                fontSize: 10,
                formatter: '{b}\n{d}%'
            },
            labelLine: { show: true, length: 20, length2: 25 },
            data: [
                { value: 70, name: 'Q1' },
                { value: 85, name: 'Q2' },
                { value: 95, name: 'Q3' },
                { value: 110, name: 'Q4' }
            ]
        },
        {
            name: '配件销售额',
            type: 'pie',
            left: '50%',
            top: 0,
            width: '50%',
            height: '100%',
            radius: '60%',
            center: ['50%', '50%'],
            label: {
                show: true,
                position: 'inside',
                fontSize: 10,
                formatter: '{b}\n{d}%'
            },
            labelLine: { show: false },
            data: [
                { value: 40, name: 'Q1' },
                { value: 45, name: 'Q2' },
                { value: 50, name: 'Q3' },
                { value: 60, name: 'Q4' }
            ]
        }
    ]
};
myChart.setOption(option);
window.addEventListener('resize', function () { myChart.resize(); });
</script>

</body>
</html>
